<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Anggota Ekstrakurikuler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <header>
        <h1>Pendaftaran Anggota Baru</h1>
        <p class="subtitle">Isi data berikut untuk bergabung dengan ekstrakurikuler pilihanmu.</p>
      </header>

      <form id="formDaftar" novalidate>
        <div class="field">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Contoh: Budi Santoso" autocomplete="name">
          <small class="error-msg" id="namaError"></small>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email">
          <small class="error-msg" id="emailError"></small>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" autocomplete="new-password">
          <small class="error-msg" id="passwordError"></small>
        </div>

        <div class="field">
          <label for="konfirmasi">Konfirmasi Password</label>
          <input type="password" id="konfirmasi" name="konfirmasi" placeholder="Ulangi password" autocomplete="new-password">
          <small class="error-msg" id="konfirmasiError"></small>
        </div>

        <div class="field">
          <label for="ekskul">Pilihan Ekstrakurikuler</label>
          <select id="ekskul" name="ekskul">
            <option value="">-- Pilih ekstrakurikuler --</option>
            <option value="pramuka">Pramuka</option>
            <option value="pmr">PMR</option>
            <option value="basket">Basket</option>
            <option value="robotik">Futsal</option>
            <option value="jurnalistik">Jurnalistik</option>
          </select>
          <small class="error-msg" id="ekskulError"></small>
        </div>

        <button type="submit">Daftar Sekarang</button>
      </form>

      <p id="pesanSukses" class="success-msg" role="status" hidden></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
